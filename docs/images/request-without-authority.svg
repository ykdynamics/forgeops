<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <rect width="760" height="560" fill="#ffffff"/>

  <rect x="250" y="20" width="260" height="96" rx="8" fill="#f4f7fb" stroke="#ccd3dd"/>
  <text x="380" y="46" text-anchor="middle" font-size="13" font-weight="700" fill="#445066" letter-spacing="1.2">REQUESTER</text>
  <text x="380" y="70" text-anchor="middle" font-size="14" fill="#172033">Human · Service · Automation · AI</text>
  <text x="380" y="94" text-anchor="middle" font-size="12.5" fill="#68758c">asks for one named operation</text>

  <path d="M380 116 L380 150" stroke="#15233a" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="392" y="139" font-size="12.5" fill="#68758c">“restart the connector”</text>

  <rect x="190" y="152" width="380" height="132" rx="8" fill="#15233a"/>
  <text x="380" y="178" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff" letter-spacing="1.4">FORGEOPS</text>
  <text x="214" y="206" font-size="13" fill="#c8d4e6">Who is asking?</text>
  <text x="214" y="228" font-size="13" fill="#c8d4e6">What operation, against which target?</text>
  <text x="214" y="250" font-size="13" fill="#c8d4e6">Which capability revision?</text>
  <text x="214" y="272" font-size="13" fill="#c8d4e6">Which authority applies?</text>

  <path d="M380 284 L380 322" stroke="#15233a" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="392" y="311" font-size="12.5" fill="#68758c">the request. nothing else.</text>

  <line x1="40" y1="303" x2="720" y2="303" stroke="#b23a48" stroke-width="1.4" stroke-dasharray="7 6"/>
  <text x="40" y="296" font-size="11.5" font-weight="700" fill="#b23a48" letter-spacing="1.2">TRUST BOUNDARY</text>

  <rect x="60" y="324" width="640" height="212" rx="8" fill="#f2f8f4" stroke="#bcd8c6"/>
  <text x="84" y="350" font-size="13" font-weight="700" fill="#2f6b46" letter-spacing="1.2">CUSTOMER ENVIRONMENT</text>

  <rect x="290" y="362" width="180" height="34" rx="6" fill="#ffffff" stroke="#bcd8c6"/>
  <text x="380" y="384" text-anchor="middle" font-size="13" fill="#172033">customer policy decides</text>

  <path d="M380 396 L380 412" stroke="#2f6b46" stroke-width="1.4"/>
  <path d="M160 412 L600 412" stroke="#2f6b46" stroke-width="1.4"/>
  <path d="M160 412 L160 430" stroke="#2f6b46" stroke-width="1.4" marker-end="url(#g)"/>
  <path d="M380 412 L380 430" stroke="#2f6b46" stroke-width="1.4" marker-end="url(#g)"/>
  <path d="M600 412 L600 430" stroke="#2f6b46" stroke-width="1.4" marker-end="url(#g)"/>

  <text x="160" y="446" text-anchor="middle" font-size="13" font-weight="700" fill="#2f6b46">ALLOW</text>
  <text x="380" y="446" text-anchor="middle" font-size="13" font-weight="700" fill="#8a6d1f">ASK</text>
  <text x="600" y="446" text-anchor="middle" font-size="13" font-weight="700" fill="#b23a48">DENY</text>
  <text x="380" y="466" text-anchor="middle" font-size="12" fill="#68758c">a person decides</text>
  <text x="600" y="466" text-anchor="middle" font-size="12" fill="#68758c">nothing runs</text>

  <rect x="96" y="478" width="360" height="30" rx="6" fill="#ffffff" stroke="#bcd8c6"/>
  <text x="276" y="498" text-anchor="middle" font-size="13" fill="#172033">bounded capability, customer-local credential</text>
  <path d="M276 508 L276 524" stroke="#2f6b46" stroke-width="1.4" marker-end="url(#g)"/>
  <text x="276" y="533" text-anchor="middle" font-size="12.5" font-weight="700" fill="#172033">TARGET</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#15233a"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2f6b46"/>
    </marker>
  </defs>
</svg>
