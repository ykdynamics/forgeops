<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 230" width="980" height="230" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <rect width="980" height="230" rx="14" fill="#f8fbff"/>
  <text x="34" y="34" font-size="16" font-weight="700" fill="#172033">The path a request takes</text>
  <text x="34" y="57" font-size="13" fill="#68758c">One named operation moves through authority before anything runs.</text>

  <g>
    <rect x="34" y="88" width="150" height="86" rx="10" fill="#ffffff" stroke="#cdd7e5"/>
    <text x="109" y="114" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">REQUESTER</text>
    <text x="109" y="138" text-anchor="middle" font-size="12" fill="#68758c">names one operation</text>
    <text x="109" y="157" text-anchor="middle" font-size="12" fill="#68758c">with bounded input</text>

    <rect x="228" y="88" width="170" height="86" rx="10" fill="#173b73"/>
    <text x="313" y="114" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">FORGEOPS</text>
    <text x="313" y="138" text-anchor="middle" font-size="12" fill="#dce8f9">binds capability, revision,</text>
    <text x="313" y="157" text-anchor="middle" font-size="12" fill="#dce8f9">target and authority</text>

    <rect x="442" y="88" width="170" height="86" rx="10" fill="#eef8f2" stroke="#b8dac4"/>
    <text x="527" y="114" text-anchor="middle" font-size="13" font-weight="700" fill="#2f6b46">CUSTOMER SIDE</text>
    <text x="527" y="138" text-anchor="middle" font-size="12" fill="#526b5c">ALLOW · ASK · DENY</text>
    <text x="527" y="157" text-anchor="middle" font-size="12" fill="#526b5c">authority decides first</text>

    <rect x="656" y="88" width="130" height="86" rx="10" fill="#ffffff" stroke="#b8dac4"/>
    <text x="721" y="114" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">CAPABILITY</text>
    <text x="721" y="138" text-anchor="middle" font-size="12" fill="#68758c">runs narrowly</text>
    <text x="721" y="157" text-anchor="middle" font-size="12" fill="#68758c">with local access</text>

    <rect x="830" y="88" width="116" height="86" rx="10" fill="#f4f7fb" stroke="#cdd7e5"/>
    <text x="888" y="114" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">EFFECT</text>
    <text x="888" y="138" text-anchor="middle" font-size="12" fill="#68758c">result + receipt</text>
    <text x="888" y="157" text-anchor="middle" font-size="12" fill="#68758c">what changed</text>
  </g>

  <g stroke="#2d6cdf" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M184 131 H218"/>
    <path d="M398 131 H432"/>
    <path d="M612 131 H646"/>
    <path d="M786 131 H820"/>
  </g>

  <text x="490" y="205" text-anchor="middle" font-size="12.5" fill="#68758c">Credentials stay customer-side. A refusal is a normal outcome.</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2d6cdf"/>
    </marker>
  </defs>
</svg>