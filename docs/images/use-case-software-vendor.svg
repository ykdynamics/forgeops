<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="920" height="420" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <rect width="920" height="420" fill="#ffffff"/>
  <text x="460" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#172033">Software vendor support — without standing access</text>
  <rect x="40" y="76" width="220" height="118" rx="10" fill="#f4f7fb" stroke="#ccd3dd"/>
  <text x="150" y="102" text-anchor="middle" font-size="13" font-weight="700" fill="#445066">VENDOR</text>
  <text x="150" y="130" text-anchor="middle" font-size="15" fill="#172033">Support engineer</text>
  <text x="150" y="154" text-anchor="middle" font-size="13" fill="#68758c">needs one bounded action</text>
  <text x="150" y="176" text-anchor="middle" font-size="13" fill="#68758c">connector.restart</text>
  <path d="M260 135 L350 135" stroke="#15233a" stroke-width="2" marker-end="url(#a)"/>
  <text x="305" y="122" text-anchor="middle" font-size="12" fill="#68758c">request</text>
  <rect x="350" y="76" width="220" height="118" rx="10" fill="#15233a"/>
  <text x="460" y="105" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">FORGEOPS</text>
  <text x="460" y="132" text-anchor="middle" font-size="13" fill="#d5dfef">bind exact operation</text>
  <text x="460" y="154" text-anchor="middle" font-size="13" fill="#d5dfef">target + revision + authority</text>
  <text x="460" y="176" text-anchor="middle" font-size="13" fill="#d5dfef">record the request</text>
  <path d="M570 135 L660 135" stroke="#15233a" stroke-width="2" marker-end="url(#a)"/>
  <text x="615" y="122" text-anchor="middle" font-size="12" fill="#68758c">bounded request</text>
  <rect x="660" y="60" width="220" height="150" rx="10" fill="#f2f8f4" stroke="#bcd8c6"/>
  <text x="770" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#2f6b46">CUSTOMER ENVIRONMENT</text>
  <text x="770" y="116" text-anchor="middle" font-size="14" fill="#172033">policy: ASK</text>
  <text x="770" y="140" text-anchor="middle" font-size="13" fill="#68758c">customer approves once</text>
  <text x="770" y="164" text-anchor="middle" font-size="13" fill="#68758c">local credential executes</text>
  <text x="770" y="188" text-anchor="middle" font-size="13" fill="#172033">connector restarts</text>
  <line x1="40" y1="238" x2="880" y2="238" stroke="#d8dee8"/>
  <text x="460" y="270" text-anchor="middle" font-size="13" font-weight="700" fill="#445066">WHAT DOES NOT HAPPEN</text>
  <g font-size="14" fill="#b23a48">
    <text x="150" y="310" text-anchor="middle">✕ VPN account</text>
    <text x="360" y="310" text-anchor="middle">✕ SSH key</text>
    <text x="560" y="310" text-anchor="middle">✕ customer credential</text>
    <text x="770" y="310" text-anchor="middle">✕ arbitrary shell</text>
  </g>
  <text x="460" y="360" text-anchor="middle" font-size="16" font-weight="700" fill="#172033">One operation gets done. Broad access is never granted.</text>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#15233a"/></marker></defs>
</svg>