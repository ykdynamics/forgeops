<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <rect width="980" height="560" rx="24" fill="#f8fbff"/>
  <text x="50" y="56" font-size="30" font-weight="700" fill="#102a43">The demo exercises all three policy outcomes</text>
  <text x="50" y="88" font-size="16" fill="#5d7288">One requester. One fictional connector. Three different decisions.</text>

  <rect x="345" y="120" width="290" height="62" rx="16" fill="#143d72"/>
  <text x="490" y="147" text-anchor="middle" font-size="16" fill="#dbeafe">operation request</text>
  <text x="490" y="169" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">customer policy decides</text>

  <path d="M490 182 L490 220" stroke="#64748b" stroke-width="3"/>
  <path d="M180 220 L800 220" stroke="#64748b" stroke-width="3"/>
  <path d="M180 220 L180 252" stroke="#0f9f6e" stroke-width="4" marker-end="url(#g)"/>
  <path d="M490 220 L490 252" stroke="#d97706" stroke-width="4" marker-end="url(#o)"/>
  <path d="M800 220 L800 252" stroke="#dc2626" stroke-width="4" marker-end="url(#r)"/>

  <rect x="70" y="265" width="220" height="165" rx="18" fill="#ecfdf5" stroke="#a7d8c1"/>
  <text x="180" y="300" text-anchor="middle" font-size="22" font-weight="700" fill="#0f9f6e">ALLOW</text>
  <text x="180" y="334" text-anchor="middle" font-size="16" fill="#102a43">read diagnostics</text>
  <text x="180" y="370" text-anchor="middle" font-size="14" fill="#5d7288">runs immediately</text>
  <text x="180" y="394" text-anchor="middle" font-size="14" fill="#5d7288">returns connector state</text>

  <rect x="380" y="265" width="220" height="165" rx="18" fill="#fff7ed" stroke="#f2c48b"/>
  <text x="490" y="300" text-anchor="middle" font-size="22" font-weight="700" fill="#d97706">ASK</text>
  <text x="490" y="334" text-anchor="middle" font-size="16" fill="#102a43">restart connector</text>
  <text x="490" y="370" text-anchor="middle" font-size="14" fill="#5d7288">held before execution</text>
  <text x="490" y="394" text-anchor="middle" font-size="14" fill="#5d7288">customer human approves or denies</text>

  <rect x="690" y="265" width="220" height="165" rx="18" fill="#fff1f2" stroke="#f0b3ba"/>
  <text x="800" y="300" text-anchor="middle" font-size="22" font-weight="700" fill="#dc2626">DENY</text>
  <text x="800" y="334" text-anchor="middle" font-size="16" fill="#102a43">open a shell</text>
  <text x="800" y="370" text-anchor="middle" font-size="14" fill="#5d7288">refused by policy</text>
  <text x="800" y="394" text-anchor="middle" font-size="14" fill="#5d7288">target remains untouched</text>

  <rect x="70" y="460" width="840" height="60" rx="15" fill="#e8f1ff"/>
  <text x="490" y="488" text-anchor="middle" font-size="17" font-weight="700" fill="#102a43">The interesting result is not only that the restart works.</text>
  <text x="490" y="510" text-anchor="middle" font-size="15" fill="#334e68">It is that approval can stop it, denial leaves zero effect, and a shell cannot be negotiated into existence.</text>

  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f9f6e"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker>
  </defs>
</svg>