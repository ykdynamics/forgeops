<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <rect width="980" height="520" rx="24" fill="#f8fbff"/>
  <text x="50" y="54" font-size="30" font-weight="700" fill="#102a43">What crosses the customer boundary?</text>
  <text x="50" y="86" font-size="16" fill="#5d7288">Requests and results cross. Credentials, routes and arbitrary command authority do not.</text>

  <rect x="45" y="125" width="365" height="285" rx="18" fill="#ffffff" stroke="#d6e2f0" stroke-width="2"/>
  <text x="75" y="164" font-size="19" font-weight="700" fill="#102a43">Requester / ForgeOps</text>
  <text x="75" y="205" font-size="16" fill="#334e68">Human · Service · Automation · AI</text>
  <rect x="75" y="238" width="285" height="48" rx="12" fill="#edf5ff"/>
  <text x="217" y="268" text-anchor="middle" font-size="15" font-weight="700" fill="#2563eb">operation request + identity + purpose</text>
  <rect x="75" y="306" width="285" height="48" rx="12" fill="#edf5ff"/>
  <text x="217" y="336" text-anchor="middle" font-size="15" font-weight="700" fill="#2563eb">decision + result + receipt</text>

  <line x1="490" y1="118" x2="490" y2="430" stroke="#b23a48" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="505" y="145" font-size="12" font-weight="700" fill="#b23a48" letter-spacing="1.1">TRUST BOUNDARY</text>

  <path d="M360 262 L455 262" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#b)"/>
  <path d="M620 330 L525 330" stroke="#0f9f6e" stroke-width="4" fill="none" marker-end="url(#g)"/>

  <rect x="570" y="125" width="365" height="285" rx="18" fill="#ffffff" stroke="#bcd8c6" stroke-width="2"/>
  <text x="600" y="164" font-size="19" font-weight="700" fill="#102a43">Customer environment</text>
  <text x="600" y="207" font-size="16" fill="#334e68">Secrets stay local</text>
  <text x="600" y="242" font-size="16" fill="#334e68">Policy + approval stay local</text>
  <text x="600" y="277" font-size="16" fill="#334e68">Capability runtime stays local</text>
  <text x="600" y="312" font-size="16" fill="#334e68">Target access stays local</text>
  <rect x="600" y="344" width="285" height="42" rx="11" fill="#ecfdf5"/>
  <text x="742" y="370" text-anchor="middle" font-size="15" font-weight="700" fill="#0f9f6e">customer-side authority</text>

  <rect x="45" y="438" width="890" height="54" rx="14" fill="#fff1f2"/>
  <text x="70" y="471" font-size="15" font-weight="700" fill="#b23a48">Does not cross:</text>
  <text x="190" y="471" font-size="15" fill="#7f1d1d">SSH credentials · VPN access · customer secrets · arbitrary commands · inbound network route · standing access</text>

  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f9f6e"/></marker>
  </defs>
</svg>