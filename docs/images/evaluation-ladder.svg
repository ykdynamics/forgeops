<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" width="980" height="330" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <rect width="980" height="330" rx="14" fill="#ffffff"/>
  <text x="34" y="38" font-size="17" font-weight="700" fill="#172033">What each evaluation level proves</text>
  <text x="34" y="61" font-size="13" fill="#68758c">Claims do not flow backward. A stronger environment proves more; it does not upgrade the laptop demo.</text>

  <rect x="34" y="92" width="280" height="190" rx="12" fill="#f5f7fb" stroke="#ccd5e2"/>
  <circle cx="64" cy="122" r="16" fill="#2d6cdf"/><text x="64" y="127" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text>
  <text x="90" y="127" font-size="14" font-weight="700" fill="#172033">LOCAL DEMO</text>
  <text x="52" y="157" font-size="12.5" fill="#2f6b46" font-weight="700">PROVES</text>
  <text x="52" y="179" font-size="12" fill="#4f5d72">• bounded operation</text>
  <text x="52" y="199" font-size="12" fill="#4f5d72">• separate approver identity</text>
  <text x="52" y="219" font-size="12" fill="#4f5d72">• real refusal and real effect</text>
  <text x="52" y="245" font-size="12.5" fill="#b23a48" font-weight="700">DOES NOT PROVE</text>
  <text x="52" y="267" font-size="12" fill="#4f5d72">machine boundary · semantic verification · artifact identity</text>

  <rect x="350" y="92" width="280" height="190" rx="12" fill="#eef8f2" stroke="#b8dac4"/>
  <circle cx="380" cy="122" r="16" fill="#35a56f"/><text x="380" y="127" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text>
  <text x="406" y="127" font-size="14" font-weight="700" fill="#172033">REAL PRIVATE EDGE</text>
  <text x="368" y="157" font-size="12.5" fill="#2f6b46" font-weight="700">ADDS</text>
  <text x="368" y="179" font-size="12" fill="#4f5d72">• independently operated edge</text>
  <text x="368" y="199" font-size="12" fill="#4f5d72">• unreachable target boundary</text>
  <text x="368" y="219" font-size="12" fill="#4f5d72">• semantic verification</text>
  <text x="368" y="239" font-size="12" fill="#4f5d72">• artifact identity by digest</text>
  <text x="368" y="266" font-size="11.5" fill="#68758c">guided session</text>

  <rect x="666" y="92" width="280" height="190" rx="12" fill="#fff7e8" stroke="#e2c886"/>
  <circle cx="696" cy="122" r="16" fill="#d79519"/><text x="696" y="127" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text>
  <text x="722" y="127" font-size="14" font-weight="700" fill="#172033">EVALUATOR-OWNED EDGE</text>
  <text x="684" y="157" font-size="12.5" fill="#8a6d1f" font-weight="700">ADDS</text>
  <text x="684" y="179" font-size="12" fill="#4f5d72">• your machine</text>
  <text x="684" y="199" font-size="12" fill="#4f5d72">• your enrolment</text>
  <text x="684" y="219" font-size="12" fill="#4f5d72">• your network</text>
  <text x="684" y="245" font-size="12" fill="#4f5d72">independence from us</text>
  <text x="684" y="266" font-size="11.5" fill="#68758c">optional, later</text>

  <path d="M314 187 H340" stroke="#7b8798" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M630 187 H656" stroke="#7b8798" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="490" y="311" text-anchor="middle" font-size="12.5" font-weight="700" fill="#172033">Stronger evaluation expands the claim set. It does not rewrite earlier evidence.</text>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7b8798"/></marker></defs>
</svg>