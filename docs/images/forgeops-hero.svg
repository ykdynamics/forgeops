<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">ForgeOps — request an operation without standing access</title>
  <desc id="desc">A requester sends one bounded operation to ForgeOps. ForgeOps binds identity, operation and target. Customer-side policy allows, asks for approval or denies before local execution. The requester receives an outcome and evidence, not standing access.</desc>

  <rect width="1200" height="460" rx="18" fill="#ffffff"/>
  <rect x="1" y="1" width="1198" height="458" rx="17" fill="none" stroke="#e3e8ef"/>

  <text x="44" y="48" font-size="13" font-weight="700" letter-spacing="1.8" fill="#2f6b46">REQUEST WITHOUT STANDING ACCESS</text>
  <text x="44" y="82" font-size="28" font-weight="760" fill="#172033">One bounded operation. Customer-side authority.</text>
  <text x="44" y="108" font-size="14" fill="#68758c">The requester can ask. Policy, approval, credentials and execution stay on the customer side.</text>

  <!-- Requester -->
  <rect x="44" y="148" width="244" height="224" rx="12" fill="#f4f7fb" stroke="#ccd3dd"/>
  <text x="66" y="178" font-size="12" font-weight="700" letter-spacing="1.4" fill="#445066">REQUESTER</text>
  <text x="66" y="207" font-size="20" font-weight="700" fill="#172033">Ask for an operation</text>

  <rect x="66" y="228" width="200" height="54" rx="8" fill="#ffffff" stroke="#ccd3dd"/>
  <circle cx="88" cy="255" r="12" fill="#e8eef7"/>
  <path d="M82 251 L88 255 L82 259" fill="none" stroke="#15233a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="91" y1="260" x2="97" y2="260" stroke="#15233a" stroke-width="2" stroke-linecap="round"/>
  <text x="110" y="250" font-size="13" font-weight="650" fill="#172033">restart connector</text>
  <text x="110" y="269" font-size="11.5" fill="#68758c">target: customer-17 / edge-4</text>

  <text x="66" y="310" font-size="12" fill="#68758c">caller identity</text>
  <text x="66" y="332" font-size="12" fill="#68758c">purpose + exact target</text>
  <text x="66" y="354" font-size="12" fill="#68758c">no SSH · no VPN · no credential</text>

  <!-- Arrow 1 -->
  <path d="M288 260 L344 260" stroke="#15233a" stroke-width="1.8" marker-end="url(#navyArrow)"/>
  <text x="316" y="244" text-anchor="middle" font-size="10.5" font-weight="700" letter-spacing="1" fill="#68758c">REQUEST</text>

  <!-- ForgeOps -->
  <rect x="346" y="134" width="306" height="252" rx="12" fill="#15233a"/>
  <text x="370" y="166" font-size="12" font-weight="700" letter-spacing="1.6" fill="#9fb2cf">FORGEOPS</text>
  <text x="370" y="198" font-size="21" font-weight="700" fill="#ffffff">Bind the request</text>
  <text x="370" y="222" font-size="12.5" fill="#c8d4e6">Make authority specific before anything runs.</text>

  <rect x="370" y="244" width="258" height="34" rx="7" fill="#203552"/>
  <circle cx="390" cy="261" r="7" fill="#9fb2cf"/>
  <text x="408" y="266" font-size="12.5" fill="#ffffff">who is asking?</text>

  <rect x="370" y="286" width="258" height="34" rx="7" fill="#203552"/>
  <circle cx="390" cy="303" r="7" fill="#9fb2cf"/>
  <text x="408" y="308" font-size="12.5" fill="#ffffff">which operation + target?</text>

  <rect x="370" y="328" width="258" height="34" rx="7" fill="#203552"/>
  <circle cx="390" cy="345" r="7" fill="#9fb2cf"/>
  <text x="408" y="350" font-size="12.5" fill="#ffffff">which capability revision?</text>

  <!-- Trust boundary -->
  <line x1="690" y1="126" x2="690" y2="394" stroke="#b23a48" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="680" y="118" text-anchor="end" font-size="10.5" font-weight="700" letter-spacing="1.2" fill="#b23a48">TRUST BOUNDARY</text>

  <!-- Arrow 2 -->
  <path d="M652 260 L716 260" stroke="#2f6b46" stroke-width="1.8" marker-end="url(#greenArrow)"/>
  <text x="684" y="244" text-anchor="middle" font-size="10.5" font-weight="700" letter-spacing="1" fill="#2f6b46">BOUNDED</text>

  <!-- Customer environment -->
  <rect x="718" y="126" width="438" height="268" rx="12" fill="#f2f8f4" stroke="#bcd8c6"/>
  <text x="742" y="158" font-size="12" font-weight="700" letter-spacing="1.5" fill="#2f6b46">CUSTOMER ENVIRONMENT</text>
  <text x="742" y="190" font-size="21" font-weight="700" fill="#172033">Customer authority decides</text>

  <rect x="742" y="210" width="118" height="72" rx="9" fill="#ffffff" stroke="#bcd8c6"/>
  <text x="801" y="235" text-anchor="middle" font-size="13" font-weight="750" fill="#2f6b46">ALLOW</text>
  <text x="801" y="255" text-anchor="middle" font-size="11.5" fill="#68758c">run now</text>
  <circle cx="801" cy="270" r="5" fill="#2f6b46"/>

  <rect x="878" y="210" width="118" height="72" rx="9" fill="#ffffff" stroke="#d9c98e"/>
  <text x="937" y="235" text-anchor="middle" font-size="13" font-weight="750" fill="#8a6d1f">ASK</text>
  <text x="937" y="255" text-anchor="middle" font-size="11.5" fill="#68758c">human decides</text>
  <circle cx="937" cy="270" r="5" fill="#8a6d1f"/>

  <rect x="1014" y="210" width="118" height="72" rx="9" fill="#ffffff" stroke="#dfbdc2"/>
  <text x="1073" y="235" text-anchor="middle" font-size="13" font-weight="750" fill="#b23a48">DENY</text>
  <text x="1073" y="255" text-anchor="middle" font-size="11.5" fill="#68758c">nothing runs</text>
  <circle cx="1073" cy="270" r="5" fill="#b23a48"/>

  <path d="M801 282 L801 304 L937 304" stroke="#2f6b46" stroke-width="1.4" fill="none"/>
  <path d="M937 282 L937 304" stroke="#8a6d1f" stroke-width="1.4"/>
  <path d="M937 304 L937 322" stroke="#2f6b46" stroke-width="1.5" marker-end="url(#greenArrow)"/>

  <rect x="796" y="324" width="282" height="42" rx="8" fill="#ffffff" stroke="#bcd8c6"/>
  <text x="937" y="343" text-anchor="middle" font-size="12.5" font-weight="700" fill="#172033">customer-local execution</text>
  <text x="937" y="358" text-anchor="middle" font-size="10.8" fill="#68758c">local policy · local credential · local target</text>

  <!-- Outcome strip -->
  <rect x="346" y="404" width="810" height="32" rx="8" fill="#f4f7fb" stroke="#dde3eb"/>
  <text x="370" y="425" font-size="11.5" font-weight="700" letter-spacing="1" fill="#445066">OUTCOME</text>
  <text x="447" y="425" font-size="12" fill="#68758c">receipt</text>
  <circle cx="502" cy="420" r="2.4" fill="#98a4b6"/>
  <text x="516" y="425" font-size="12" fill="#68758c">effect result</text>
  <circle cx="596" cy="420" r="2.4" fill="#98a4b6"/>
  <text x="610" y="425" font-size="12" fill="#68758c">evidence</text>
  <circle cx="671" cy="420" r="2.4" fill="#98a4b6"/>
  <text x="685" y="425" font-size="12" fill="#68758c">no standing foothold</text>

  <defs>
    <marker id="navyArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#15233a"/>
    </marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2f6b46"/>
    </marker>
  </defs>
</svg>
